# Configurações do Projeto Jumpman

# Configurações de Compilação
compiler.source=21
compiler.target=21
compiler.encoding=UTF-8

# Configurações de Execução
run.mode=INTERACTION_TEST   # Valores possíveis: INTERACTION_TEST, WEATHER_TEST, ORIGINAL
run.fullscreen=false
run.resolution=800x600

# Configurações de Debug
debug.show_fps=true
debug.show_bounds=true
debug.show_player_info=true

# Configurações de Jogo
game.initial_lives=3
game.sound_enabled=true
game.show_instructions=true

# Informações do Projeto
project.name=Jumpman
project.version=1.2.0
project.author=JumpMan Team
project.instructions_file=INSTRUCTIONS.md

# Caminho para recursos
paths.resources=resources
paths.images=resources/images
paths.sounds=resources/sounds
